name: ScrapTikTok - Moteur Presse Apify

on:
  push:
    branches: [deploy-scraptiktok, deploy-tiktok]
    paths:
      - "collecte/presse_apify.py"
      - "connect_presse.py"
      - "connect_profil.py"
      - "connect_htag.py"
      - "collecte/presse_research.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_presse_apify.py"
      - "tests/test_connexions_modes.py"
      - "tests/test_moteurs_hashtags_profils.py"
      - "tests/test_presse_isolation_version.py"
      - ".github/workflows/presse-apify.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances de test
        run: python -m pip install -r requirements-dev.txt
      - name: Verifier la syntaxe Python
        run: |
          python -m compileall -q collecte/presse_apify.py connect_presse.py webapp.py streamlit_app.py tests/test_presse_apify.py
      - name: Tester Apify sans jeton ni requete payante
        run: python -m unittest discover -s tests -p test_presse_apify.py -v
      - name: Tester la selection des moteurs Presse
        run: python -m unittest discover -s tests -p test_presse_isolation_version.py -v
      - name: Tester les moteurs Hashtags et Profils
        run: |
          python -m unittest discover -s tests -p test_connexions_modes.py -v
          python -m unittest discover -s tests -p test_moteurs_hashtags_profils.py -v
