name: Tests dashboard Redis

on:
  push:
    paths:
      - "dashboard_shared/**"
      - "assets/app.js"
      - "index.html"
      - "tests/test_isolation_statuts_dashboard.py"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    paths:
      - "dashboard_shared/**"
      - "assets/app.js"
      - "index.html"
      - "tests/test_isolation_statuts_dashboard.py"
      - ".github/workflows/dashboard-tests.yml"

jobs:
  isolation-tickets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Vérifier les fichiers Python
        run: |
          python -m compileall -q dashboard_shared dashboard_api.py tests/test_isolation_statuts_dashboard.py
      - name: Vérifier les fichiers JavaScript
        run: node --check assets/app.js
      - name: Vérifier l'isolation des tickets
        run: python -m pytest -q tests/test_isolation_statuts_dashboard.py
