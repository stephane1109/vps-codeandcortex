name: ScrapTikTok - Colonnes CSV simplifiées

on:
  push:
    branches: [deploy-scraptiktok]
    paths:
      - "corpus/publications_csv.py"
      - "corpus/construction.py"
      - "analyse_desordre/corpus_fusion.py"
      - "tests/test_publications_csv.py"
      - "tests/test_colonnes_csv_simplifiees.py"
      - ".github/workflows/colonnes-csv-simplifiees.yml"
  workflow_dispatch:

jobs:
  colonnes-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe
        run: |
          python -m compileall -q corpus analyse_desordre/corpus_fusion.py tests/test_colonnes_csv_simplifiees.py
      - name: Vérifier les colonnes CSV simplifiées
        run: python -m unittest discover -s tests -p test_colonnes_csv_simplifiees.py -v
      - name: Vérifier publications.csv et les champs PostgreSQL
        run: python -m unittest discover -s tests -p test_publications_csv.py -v
      - name: Vérifier les republications
        run: python -m unittest discover -s tests -p test_republications_research.py -v
      - name: Vérifier Désordre visuel et les fusions
        run: python -m unittest discover -s tests -p test_corpus_fusion_desordre.py -v
