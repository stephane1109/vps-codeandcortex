name: ScrapTikTok - Historique et codages 30 jours

on:
  pull_request:
    paths:
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_historique_desordre_sauvegarde.py"
      - ".github/workflows/historique-desordre.yml"
  push:
    paths:
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_historique_desordre_sauvegarde.py"
      - ".github/workflows/historique-desordre.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Syntaxe
        run: python -m compileall -q webapp.py streamlit_app.py tests/test_historique_desordre_sauvegarde.py
      - name: Tester historique et codages
        run: |
          python -m unittest discover -s tests -p test_historique_desordre_sauvegarde.py -v
          python -m unittest discover -s tests -p test_codages_personnalises.py -v
