name: ScrapTikTok - Croisement multi-hashtags Presse

on:
  push:
    branches: [deploy-scraptiktok]
    paths:
      - "webapp.py"
      - "streamlit_app.py"
      - "connect_presse.py"
      - "collecte/comptes.py"
      - "collecte/researchapi.py"
      - "corpus/publications_csv.py"
      - "corpus/construction.py"
      - "analyse_desordre/corpus_fusion.py"
      - "tests/test_presse_croisement.py"
      - "tests/test_presse_research.py"
      - ".github/workflows/presse-multihashtags.yml"
  workflow_dispatch:

jobs:
  regression-multi-hashtags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances des tests
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe
        run: |
          python -m compileall -q webapp.py streamlit_app.py connect_presse.py collecte/comptes.py collecte/researchapi.py corpus/publications_csv.py corpus/construction.py analyse_desordre/corpus_fusion.py tests/test_presse_croisement.py tests/test_presse_research.py
      - name: Tester les opérateurs, les anciens filtres et les CSV
        run: python -m unittest discover -s tests -p test_presse_croisement.py -v
      - name: Tester la Research API sans accès réseau
        run: python -m unittest discover -s tests -p test_presse_research.py -v
