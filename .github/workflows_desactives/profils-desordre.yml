name: ScrapTikTok comptes presse et désordre visuel

on:
  push:
    paths:
      - "collecte/comptes.py"
      - "analyse_desordre/sources.py"
      - "analyse_desordre/service.py"
      - "webapp.py"
      - "tests/test_profil_desordre_integration.py"
      - ".github/workflows/profils-desordre.yml"
  pull_request:
    paths:
      - "collecte/comptes.py"
      - "analyse_desordre/sources.py"
      - "analyse_desordre/service.py"
      - "webapp.py"
      - "tests/test_profil_desordre_integration.py"
      - ".github/workflows/profils-desordre.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Valider les fichiers Python
        run: python -m compileall -q collecte/comptes.py analyse_desordre/sources.py analyse_desordre/service.py webapp.py tests/test_profil_desordre_integration.py
      - name: Tester la pagination et l'analyse visuelle
        run: python -m unittest discover -s tests -p test_profil_desordre_integration.py -v
