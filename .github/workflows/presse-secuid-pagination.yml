name: ScrapTikTok - Pagination média secUid

on:
  push:
    paths:
      - "collecte/presse_api.py"
      - "collecte/comptes.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_presse_secuid_api.py"
      - "tests/test_presse_onglet_videos.py"
      - ".github/workflows/presse-secuid-pagination.yml"
  pull_request:
    paths:
      - "collecte/presse_api.py"
      - "collecte/comptes.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_presse_secuid_api.py"
      - "tests/test_presse_onglet_videos.py"
      - ".github/workflows/presse-secuid-pagination.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Syntaxe des fichiers modifiés
        run: python -m compileall -q collecte/presse_api.py collecte/comptes.py webapp.py streamlit_app.py tests/test_presse_secuid_api.py
      - name: Test de pagination API et de repli navigateur
        run: |
          python -m unittest discover -s tests -p test_presse_secuid_api.py -v
          python -m unittest discover -s tests -p test_presse_onglet_videos.py -v
          python -m unittest discover -s tests -p test_rubrique_videos_medias.py -v
          python -m unittest discover -s tests -p test_pagination_profils.py -v
