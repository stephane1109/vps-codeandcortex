name: ScrapTikTok - Htag dans le CSV

on:
  push:
    branches: [deploy-scraptiktok]
    paths:
      - "webapp.py"
      - "streamlit_app.py"
      - "corpus/publications_csv.py"
      - "corpus/construction.py"
      - "tests/test_htags_csv.py"
      - ".github/workflows/htag-csv.yml"
  workflow_dispatch:

jobs:
  export-hashtags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q webapp.py streamlit_app.py corpus/publications_csv.py corpus/construction.py tests/test_htags_csv.py
      - name: Tester le choix Htag dans le csv
        run: python -m unittest discover -s tests -p test_htags_csv.py -v
      - name: Vérifier la conservation des anciens exports TXT
        run: python -m unittest discover -s tests -p test_format_txt.py -v
      - name: Vérifier les variables de presse dans les CSV
        run: python -m unittest discover -s tests -p test_categories_presse_illustratives.py -v
