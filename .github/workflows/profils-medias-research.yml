name: ScrapTikTok - Profils médias Research

on:
  push:
    branches: [deploy-scraptiktok]
    paths:
      - "collecte/profils_medias.py"
      - "collecte/researchapi.py"
      - "corpus/construction.py"
      - "streamlit_app.py"
      - "webapp.py"
      - "tests/test_profils_medias_research.py"
      - "tests/test_researchapi_abonnes.py"
      - ".github/workflows/profils-medias-research.yml"
  workflow_dispatch:

jobs:
  tests-profils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe
        run: python -m compileall -q collecte/profils_medias.py collecte/researchapi.py corpus/construction.py streamlit_app.py webapp.py tests/test_profils_medias_research.py
      - name: Tester les métriques des comptes médias
        run: python -m unittest discover -s tests -p test_profils_medias_research.py -v
      - name: Vérifier le collecteur d'abonnés existant
        run: python -m unittest discover -s tests -p test_researchapi_abonnes.py -v
      - name: Vérifier les autres méthodes Research
        run: python -m unittest discover -s tests -p test_presse_research.py -v
      - name: Vérifier les exports et les regroupements
        run: |
          python -m unittest discover -s tests -p test_publications_csv.py -v
          python -m unittest discover -s tests -p test_groupes_presse.py -v
