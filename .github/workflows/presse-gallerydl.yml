name: ScrapTikTok - Moteur Presse gallery-dl

on:
  push:
    branches: [deploy-scraptiktok]
    paths:
      - "collecte/presse_gallerydl.py"
      - "connect_presse.py"
      - "collecte/comptes.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "requirements.txt"
      - "tests/test_presse_gallerydl.py"
      - "tests/test_presse_isolation_version.py"
      - ".github/workflows/presse-gallerydl.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer la version déclarée de gallery-dl et les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe
        run: |
          python -m compileall -q collecte/presse_gallerydl.py connect_presse.py webapp.py streamlit_app.py tests/test_presse_gallerydl.py
          python -m gallery_dl --version
      - name: Tester les extractions et les refus gallery-dl sans réseau
        run: python -m unittest discover -s tests -p test_presse_gallerydl.py -v
      - name: Tester le choix du moteur Presse
        run: python -m unittest discover -s tests -p test_presse_isolation_version.py -v

  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer gallery-dl
        run: python -m pip install "gallery-dl>=1.31,<2"
      - name: Test public non bloquant de @lemondefr (une seule publication)
        run: |
          python - <<'PY'
          import json, subprocess, sys
          cmd = [sys.executable, '-m', 'gallery_dl', '--config-ignore', '--dump-json',
                 '--post-range', '1-1', '-o', 'tiktok.order-posts=desc',
                 '-o', 'tiktok.videos=true', '-o', 'tiktok.photos=false',
                 'https://www.tiktok.com/@lemondefr/posts']
          try:
              result = subprocess.run(cmd, text=True, capture_output=True, timeout=60)
              try:
                  rows = json.loads(result.stdout)
              except (ValueError, TypeError):
                  rows = []
              posts = [row[2] for row in rows if isinstance(row, list) and
                       len(row) >= 3 and row[0] == 2 and isinstance(row[2], dict)]
              print('gallery-dl, compte @lemondefr :', len(posts), 'publication(s)')
              print('Code retour :', result.returncode)
              if not posts:
                  raise SystemExit('TikTok n’a pas fourni de publication à ce navigateur GitHub Actions')
          except subprocess.TimeoutExpired:
              raise SystemExit('Test réseau TikTok interrompu à 60 secondes')
          PY
