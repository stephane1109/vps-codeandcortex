name: ScrapTikTok - Texte IA et format TXT

on:
  push:
    branches: [deploy-scraptiktok]
    paths:
      - "scraptiktok.py"
      - "connect_presse.py"
      - "tests/test_resume_ia.py"
      - "tests/test_cadence_collecte.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_scraptiktok.py"
      - "tests/test_format_txt.py"
      - "tests/test_webapp.py"
      - ".github/workflows/texte-ia-tiktok.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer les dépendances des tests
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe des scripts
        run: python -m compileall -q scraptiktok.py webapp.py streamlit_app.py tests/test_scraptiktok.py tests/test_format_txt.py tests/test_webapp.py
      - name: Tester l'extraction TikTok
        run: python -m unittest discover -s tests -p test_scraptiktok.py -v
      - name: Tester le chargement différé des résumés et le JavaScript Selenium
        run: python -m unittest discover -s tests -p test_resume_ia.py -v
      - name: Vérifier la cadence sans IA et les lots tardifs des hashtags
        run: python -m unittest discover -s tests -p test_cadence_collecte.py -v
      - name: Tester le format des corpus TXT
        run: python -m unittest discover -s tests -p test_format_txt.py -v
      - name: Tester le téléchargement depuis FastAPI
        run: python -m unittest discover -s tests -p test_webapp.py -v
