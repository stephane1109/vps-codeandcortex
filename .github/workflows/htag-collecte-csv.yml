name: ScrapTikTok - Htag collecte CSV

on:
  push:
    branches: [deploy-scraptiktok]
    paths:
      - "corpus/publications_csv.py"
      - "corpus/construction.py"
      - "analyse_desordre/corpus_fusion.py"
      - "webapp.py"
      - "tests/test_htag_collecte_csv.py"
      - "tests/test_presse_croisement.py"
      - ".github/workflows/htag-collecte-csv.yml"
  workflow_dispatch:

jobs:
  test-htag-collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe
        run: |
          python -m compileall -q webapp.py corpus/publications_csv.py corpus/construction.py analyse_desordre/corpus_fusion.py tests/test_htag_collecte_csv.py
      - name: Vérifier htag_collecte et valeurs vides
        run: python -m unittest discover -s tests -p test_htag_collecte_csv.py -v
      - name: Vérifier le croisement de hashtags Presse
        run: python -m unittest discover -s tests -p test_presse_croisement.py -v
      - name: Vérifier le corpus complet
        run: python -m unittest discover -s tests -p test_corpus_fusion_desordre.py -v
      - name: Vérifier les colonnes publications
        run: python -m unittest discover -s tests -p test_publications_csv.py -v
