name: ScrapTikTok - Arrêt HTTP 429
on:
  push:
    paths:
      - "collecte/presse_api.py"
      - "collecte/comptes.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_presse_rate_limit_429.py"
      - "tests/test_presse_isolation_version.py"
      - ".github/workflows/presse-limitation-429.yml"
  pull_request:
    paths:
      - "collecte/presse_api.py"
      - "collecte/comptes.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_presse_rate_limit_429.py"
      - "tests/test_presse_isolation_version.py"
      - ".github/workflows/presse-limitation-429.yml"
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances de test
        run: python -m pip install -r requirements-dev.txt
      - name: Syntaxe
        run: python -m compileall -q collecte/presse_api.py collecte/comptes.py webapp.py streamlit_app.py tests/test_presse_rate_limit_429.py
      - name: Limitation 429 et non-reprise
        run: |
          python -m unittest discover -s tests -p test_presse_rate_limit_429.py -v
          python -m unittest discover -s tests -p test_presse_secuid_api.py -v
          python -m unittest discover -s tests -p test_presse_isolation_version.py -v
