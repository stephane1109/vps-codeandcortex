name: ScrapTikTok - Republications Research API

on:
  push:
    branches: [deploy-scraptiktok]
    paths:
      - "collecte/republications_research.py"
      - "collecte/researchapi.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "corpus/publications_csv.py"
      - "corpus/construction.py"
      - "analyse_desordre/corpus_fusion.py"
      - "tests/test_republications_research.py"
      - ".github/workflows/republications-research.yml"
  workflow_dispatch:

jobs:
  republications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe Python
        run: |
          python -m compileall -q collecte/republications_research.py collecte/researchapi.py webapp.py streamlit_app.py corpus tests/test_republications_research.py
      - name: Tester l'API de republications et les archives sans accès réseau
        run: python -m unittest discover -s tests -p test_republications_research.py -v
      - name: Vérifier la compatibilité Research API
        run: python -m unittest discover -s tests -p test_presse_research.py -v
