name: ScrapTikTok - Pause TikTok 429
on:
  push:
    paths:
      - "collecte/tiktok_limitation.py"
      - "collecte/presse_api.py"
      - "collecte/comptes.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_tiktok_limitation_persistante.py"
      - ".github/workflows/presse-cooldown.yml"
  pull_request:
    paths:
      - "collecte/tiktok_limitation.py"
      - "collecte/presse_api.py"
      - "collecte/comptes.py"
      - "webapp.py"
      - "streamlit_app.py"
      - "tests/test_tiktok_limitation_persistante.py"
      - ".github/workflows/presse-cooldown.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier la syntaxe
        run: python -m compileall -q collecte/tiktok_limitation.py collecte/presse_api.py collecte/comptes.py webapp.py streamlit_app.py
      - name: Tester la pause persistante
        run: |
          python -m unittest discover -s tests -p test_tiktok_limitation_persistante.py -v
          python -m unittest discover -s tests -p test_presse_rate_limit_429.py -v
          python -m unittest discover -s tests -p test_presse_isolation_version.py -v
