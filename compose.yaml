services:
  scraptiktok:
    build:
      context: .
      args:
        INSTALL_VIDEO: "${INSTALL_VIDEO:-semantique}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8501}:8501"
    shm_size: "1gb"
    mem_limit: "${MEM_LIMIT:-2g}"
    cpus: 2
    environment:
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-1}"
      JOB_TIMEOUT_SECONDS: "${JOB_TIMEOUT_SECONDS:-900}"
      IDLE_TIMEOUT_SECONDS: "${IDLE_TIMEOUT_SECONDS:-180}"
      SCRAPTIKTOK_MAX_POSTS_PER_SOURCE: "${SCRAPTIKTOK_MAX_POSTS_PER_SOURCE:-50}"
      SCRAPTIKTOK_MAX_SOURCES_PER_JOB: "${SCRAPTIKTOK_MAX_SOURCES_PER_JOB:-3}"
      SCRAPTIKTOK_MAX_POSTS_PER_JOB: "${SCRAPTIKTOK_MAX_POSTS_PER_JOB:-150}"
      SCRAPTIKTOK_MAX_COMMENTS_PER_POST: "${SCRAPTIKTOK_MAX_COMMENTS_PER_POST:-20}"
      SCRAPTIKTOK_MAX_JOBS_PER_DAY: "${SCRAPTIKTOK_MAX_JOBS_PER_DAY:-8}"
      SCRAPTIKTOK_API_REQUESTS_PER_HOUR: "${SCRAPTIKTOK_API_REQUESTS_PER_HOUR:-30}"
      SCRAPTIKTOK_API_REQUESTS_PER_DAY: "${SCRAPTIKTOK_API_REQUESTS_PER_DAY:-100}"
      SCRAPTIKTOK_API_GAP_SECONDS: "${SCRAPTIKTOK_API_GAP_SECONDS:-5}"
      SCRAPTIKTOK_MAX_SCROLLS: "${SCRAPTIKTOK_MAX_SCROLLS:-12}"
      SCRAPTIKTOK_PAGE_DELAY_SECONDS: "${SCRAPTIKTOK_PAGE_DELAY_SECONDS:-5}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      APP_ACCESS_USER: "${APP_ACCESS_USER:-scraptiktok}"
      APP_ACCESS_PASSWORD: "${APP_ACCESS_PASSWORD:-}"
    volumes:
      - scraptiktok-data:/app/data
volumes:
  scraptiktok-data:
