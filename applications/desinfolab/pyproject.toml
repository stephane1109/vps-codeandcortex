[project]
name = "desinfolab"
version = "1.0.0"
description = "Observatoire collaboratif de sources et de corpus documentés"
requires-python = ">=3.11,<3.12"
dependencies = [
  "streamlit>=1.45,<2", "SQLAlchemy>=2.0.40,<2.1", "fastapi>=0.115,<1",
  "pydantic>=2.11,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "uvicorn>=0.34,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["desinfolab*"]
