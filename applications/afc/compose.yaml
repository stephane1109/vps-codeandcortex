services:
  afc-factominer:
    build: .
    container_name: afc-factominer
    restart: unless-stopped
    init: true
    environment:
      AFC_TIMEOUT_SECONDS: "180"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      # Transmettre la même URL Redis que celle du dashboard VPS.
      REDIS_URL: "${REDIS_URL:-}"
    ports:
      # Accès local au VPS : utiliser un reverse proxy HTTPS pour l'extérieur.
      - "127.0.0.1:8501:8501"
    expose:
      - "8501"
    mem_limit: 3g
    cpus: 2.0
    # Rendre Redis et les autres services Coolify accessibles depuis l'AFC.
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true
    name: coolify
