<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">A_rad - eloignement par rapport au centre</title>
  <desc id="desc">Les classes sortent du centre AFC. Le mot-exemple lambda se place loin du centre, avec la classe 1. Plus les classes s'eloignent du centre, plus A_rad monte.</desc>
  <rect width="600" height="600" rx="20" fill="#fbfaf7"/>
  <rect x="20" y="20" width="560" height="560" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_rad</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Eloignement des classes par rapport au centre AFC</text>
  <circle cx="170" cy="255" r="24" fill="none" stroke="#d8d2c8" stroke-width="2"/>
  <circle cx="170" cy="255" r="70" fill="none" stroke="#e8e2da" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="170" cy="255" r="118" fill="none" stroke="#efe8df" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="170" cy="255" r="7" fill="#2f2a27"/>
  <text x="186" y="260" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">centre</text>
  <circle cx="266" cy="150" r="15" fill="#41b3a3"/>
  <circle cx="300" cy="137" r="6" fill="#1f2937"/>
  <text x="312" y="143" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">lambda</text>
  <text x="312" y="160" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">mot exemple</text>
  <circle cx="362" cy="330" r="15" fill="#ef8354"/>
  <text x="238" y="128" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe 1</text>
  <text x="374" y="336" font-family="Arial, sans-serif" font-size="14" fill="#ef8354">Classe 2</text>
  <text x="42" y="410" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">A_rad regarde a quelle distance du centre se trouvent les classes.</text>
  <text x="42" y="438" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Une classe tres centrale discrimine peu sur le plan AFC.</text>
  <text x="42" y="476" font-family="Arial, sans-serif" font-size="15" fill="#7f756b">r_i = √(x_i² + y_i²)</text>
  <text x="42" y="500" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">Plus les classes sortent du centre, plus A_rad monte.</text>
</svg>
