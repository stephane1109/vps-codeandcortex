<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">A_align - alignement des termes avec leur classe</title>
  <desc id="desc">Le plan AFC montre l'origine, les axes x et y, le vecteur de la classe i et le vecteur du mot-exemple lambda. L'angle est mesure a l'origine entre les deux vecteurs pour lire leur alignement.</desc>
  <defs>
    <marker id="arrow-class" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#41b3a3"/>
    </marker>
    <marker id="arrow-term" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="600" height="600" rx="20" fill="#fbfaf7"/>
  <rect x="20" y="20" width="560" height="560" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_align</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Alignement entre la direction d'un terme et celle de sa classe sur l'AFC</text>
  <line x1="90" y1="340" x2="340" y2="340" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="150" y1="372" x2="150" y2="110" stroke="#d8d2c8" stroke-width="2"/>
  <text x="348" y="345" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">axe x</text>
  <text x="158" y="122" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">axe y</text>
  <circle cx="150" cy="340" r="7" fill="#2f2a27"/>
  <text x="163" y="358" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">origine</text>
  <line x1="150" y1="340" x2="300" y2="170" stroke="#41b3a3" stroke-width="6" marker-end="url(#arrow-class)"/>
  <line x1="150" y1="340" x2="264" y2="202" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow-term)"/>
  <line x1="300" y1="170" x2="300" y2="340" stroke="#b8dcd6" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="150" y1="170" x2="300" y2="170" stroke="#b8dcd6" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="264" y1="202" x2="264" y2="340" stroke="#d1d5db" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="150" y1="202" x2="264" y2="202" stroke="#d1d5db" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="300" cy="170" r="9" fill="#41b3a3"/>
  <circle cx="264" cy="202" r="8" fill="#1f2937"/>
  <text x="312" y="165" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe i</text>
  <text x="312" y="182" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">v_i = (x_i, y_i)</text>
  <text x="274" y="197" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">lambda</text>
  <text x="274" y="214" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">t = (x_t, y_t)</text>
  <path d="M228 272 A46 46 0 0 1 252 246" fill="none" stroke="#7f756b" stroke-width="3"/>
  <circle cx="246" cy="300" r="6" fill="#c7c1b6"/>
  <text x="258" y="305" font-family="Arial, sans-serif" font-size="13" fill="#8a8178">terme moins aligné</text>
  <line x1="150" y1="340" x2="246" y2="300" stroke="#c7c1b6" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="42" y="410" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">On recupere sur l'AFC la classe i et le mot lambda.</text>
  <text x="42" y="438" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Puis on mesure, a l'origine, l'angle entre les deux vecteurs.</text>
  <text x="42" y="478" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">Directions proches = alignement fort</text>
  <text x="42" y="502" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">Directions divergentes = alignement faible</text>
</svg>
