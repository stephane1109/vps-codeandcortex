<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">A_align - alignement des termes avec leur classe</title>
  <desc id="desc">Le vecteur de la classe 1 et le mot-exemple lambda pointent dans la meme direction. Cela illustre un bon alignement lexical.</desc>
  <defs>
    <marker id="arrow-align" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#41b3a3"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="20" fill="#fbfaf7"/>
  <rect x="22" y="22" width="676" height="276" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_align</text>
  <text x="42" y="80" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Alignement des termes significatifs avec la direction de leur classe</text>
  <line x1="170" y1="245" x2="170" y2="85" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="95" y1="175" x2="630" y2="175" stroke="#d8d2c8" stroke-width="2"/>
  <circle cx="170" cy="175" r="7" fill="#2f2a27"/>
  <line x1="170" y1="175" x2="400" y2="80" stroke="#41b3a3" stroke-width="6" marker-end="url(#arrow-align)"/>
  <text x="407" y="84" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe 1</text>
  <circle cx="344" cy="103" r="7" fill="#1f2937"/>
  <text x="357" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">lambda</text>
  <text x="357" y="124" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">mot exemple</text>
  <circle cx="315" cy="210" r="6" fill="#c7c1b6"/>
  <text x="327" y="216" font-family="Arial, sans-serif" font-size="14" fill="#8a8178">terme faible</text>
  <path d="M255 140 L340 106" fill="none" stroke="#7f756b" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="425" y="146" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Quand lambda suit la meme direction que la classe, A_align monte.</text>
</svg>
