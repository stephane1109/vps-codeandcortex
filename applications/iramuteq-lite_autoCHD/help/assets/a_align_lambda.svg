<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">A_align - alignement des termes avec leur classe</title>
  <desc id="desc">Le plan AFC montre l'origine, les axes x et y, le vecteur de la classe i et le vecteur du mot-exemple lambda. Le petit angle entre les deux vecteurs illustre un bon alignement.</desc>
  <defs>
    <marker id="arrow-class" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#41b3a3"/>
    </marker>
    <marker id="arrow-term" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="760" height="360" rx="20" fill="#fbfaf7"/>
  <rect x="22" y="22" width="716" height="316" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_align</text>
  <text x="42" y="80" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Alignement entre la direction d'un terme et celle de sa classe sur le plan AFC</text>
  <line x1="150" y1="275" x2="430" y2="275" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="210" y1="310" x2="210" y2="80" stroke="#d8d2c8" stroke-width="2"/>
  <text x="436" y="280" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">axe x</text>
  <text x="216" y="90" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">axe y</text>
  <circle cx="210" cy="275" r="7" fill="#2f2a27"/>
  <text x="223" y="293" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">origine</text>
  <line x1="210" y1="275" x2="380" y2="125" stroke="#41b3a3" stroke-width="6" marker-end="url(#arrow-class)"/>
  <line x1="210" y1="275" x2="345" y2="150" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow-term)"/>
  <line x1="380" y1="125" x2="380" y2="275" stroke="#b8dcd6" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="210" y1="125" x2="380" y2="125" stroke="#b8dcd6" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="345" y1="150" x2="345" y2="275" stroke="#d1d5db" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="210" y1="150" x2="345" y2="150" stroke="#d1d5db" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="380" cy="125" r="9" fill="#41b3a3"/>
  <circle cx="345" cy="150" r="8" fill="#1f2937"/>
  <text x="389" y="118" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe i</text>
  <text x="389" y="135" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">v_i = (x_i, y_i)</text>
  <text x="354" y="144" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">lambda</text>
  <text x="354" y="160" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">t = (x_t, y_t)</text>
  <text x="336" y="294" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">x_t</text>
  <text x="175" y="154" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">y_t</text>
  <text x="372" y="294" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">x_i</text>
  <text x="175" y="129" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">y_i</text>
  <path d="M288 206 A44 44 0 0 1 316 186" fill="none" stroke="#7f756b" stroke-width="3"/>
  <text x="320" y="188" font-family="Arial, sans-serif" font-size="13" fill="#7f756b">petit angle</text>
  <circle cx="320" cy="250" r="6" fill="#c7c1b6"/>
  <text x="332" y="255" font-family="Arial, sans-serif" font-size="13" fill="#8a8178">terme moins aligné</text>
  <line x1="210" y1="275" x2="320" y2="250" stroke="#c7c1b6" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="474" y="120" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">On récupère sur l'AFC :</text>
  <text x="474" y="145" font-family="Arial, sans-serif" font-size="14" fill="#2f2a27">- la classe i : (x_i, y_i)</text>
  <text x="474" y="168" font-family="Arial, sans-serif" font-size="14" fill="#2f2a27">- le mot lambda : (x_t, y_t)</text>
  <text x="474" y="200" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Puis on compare l'angle entre</text>
  <text x="474" y="222" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">les deux vecteurs partant de l'origine.</text>
  <text x="474" y="255" font-family="Arial, sans-serif" font-size="15" fill="#7f756b">Petit angle = bon alignement</text>
  <text x="474" y="278" font-family="Arial, sans-serif" font-size="15" fill="#7f756b">Angle large = alignement faible</text>
</svg>
