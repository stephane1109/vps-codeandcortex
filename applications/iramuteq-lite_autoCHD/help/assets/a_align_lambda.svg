<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">A_align - alignement des termes avec leur classe</title>
  <desc id="desc">Le plan AFC montre l'origine, les axes x et y, le vecteur de la classe i et le vecteur du mot-exemple lambda. L'angle est mesure a l'origine entre les deux vecteurs pour lire leur alignement.</desc>
  <defs>
    <marker id="arrow-class" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#41b3a3"/>
    </marker>
    <marker id="arrow-term" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="760" height="430" rx="20" fill="#fbfaf7"/>
  <rect x="22" y="22" width="716" height="386" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_align</text>
  <text x="42" y="80" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Alignement entre la direction d'un terme et celle de sa classe sur le plan AFC</text>
  <line x1="150" y1="325" x2="430" y2="325" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="210" y1="360" x2="210" y2="90" stroke="#d8d2c8" stroke-width="2"/>
  <text x="436" y="330" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">axe x</text>
  <text x="216" y="90" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">axe y</text>
  <circle cx="210" cy="325" r="7" fill="#2f2a27"/>
  <text x="223" y="343" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">origine</text>
  <line x1="210" y1="325" x2="390" y2="145" stroke="#41b3a3" stroke-width="6" marker-end="url(#arrow-class)"/>
  <line x1="210" y1="325" x2="350" y2="175" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow-term)"/>
  <line x1="390" y1="145" x2="390" y2="325" stroke="#b8dcd6" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="210" y1="145" x2="390" y2="145" stroke="#b8dcd6" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="350" y1="175" x2="350" y2="325" stroke="#d1d5db" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="210" y1="175" x2="350" y2="175" stroke="#d1d5db" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="390" cy="145" r="9" fill="#41b3a3"/>
  <circle cx="350" cy="175" r="8" fill="#1f2937"/>
  <text x="399" y="138" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe i</text>
  <text x="399" y="155" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">v_i = (x_i, y_i)</text>
  <text x="359" y="169" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">lambda</text>
  <text x="359" y="185" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">t = (x_t, y_t)</text>
  <text x="341" y="344" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">x_t</text>
  <text x="175" y="179" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">y_t</text>
  <text x="382" y="344" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">x_i</text>
  <text x="175" y="149" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">y_i</text>
  <path d="M293 258 A52 52 0 0 1 327 222" fill="none" stroke="#7f756b" stroke-width="3"/>
  <circle cx="330" cy="300" r="6" fill="#c7c1b6"/>
  <text x="342" y="305" font-family="Arial, sans-serif" font-size="13" fill="#8a8178">terme moins aligné</text>
  <line x1="210" y1="325" x2="330" y2="300" stroke="#c7c1b6" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="474" y="120" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">On récupère sur l'AFC :</text>
  <text x="474" y="145" font-family="Arial, sans-serif" font-size="14" fill="#2f2a27">- la classe i : (x_i, y_i)</text>
  <text x="474" y="168" font-family="Arial, sans-serif" font-size="14" fill="#2f2a27">- le mot lambda : (x_t, y_t)</text>
  <text x="474" y="215" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Puis on mesure, a l'origine,</text>
  <text x="474" y="237" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">l'angle entre les deux vecteurs.</text>
  <text x="474" y="272" font-family="Arial, sans-serif" font-size="15" fill="#7f756b">Alignement fort si leurs directions sont proches.</text>
  <text x="474" y="295" font-family="Arial, sans-serif" font-size="15" fill="#7f756b">Alignement faible si leurs directions divergent.</text>
</svg>
