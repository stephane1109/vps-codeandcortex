<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">A_theta - opposition angulaire des classes</title>
  <desc id="desc">Deux vecteurs de classes partent du centre AFC dans des directions opposees. Le mot-exemple lambda suit la classe 1. Plus l'opposition angulaire est forte, plus A_theta monte.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#41b3a3"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef8354"/>
    </marker>
  </defs>
  <rect width="600" height="600" rx="20" fill="#fbfaf7"/>
  <rect x="20" y="20" width="560" height="560" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_theta</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Opposition angulaire des classes sur le plan AFC</text>
  <line x1="165" y1="360" x2="165" y2="120" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="70" y1="250" x2="330" y2="250" stroke="#d8d2c8" stroke-width="2"/>
  <circle cx="165" cy="250" r="7" fill="#2f2a27"/>
  <text x="180" y="269" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">centre</text>
  <line x1="165" y1="250" x2="88" y2="150" stroke="#41b3a3" stroke-width="6" marker-end="url(#arrow-teal)"/>
  <line x1="165" y1="250" x2="308" y2="342" stroke="#ef8354" stroke-width="6" marker-end="url(#arrow-coral)"/>
  <path d="M115 190 A72 72 0 0 1 233 314" fill="none" stroke="#7f756b" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="242" y="308" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">angle fort</text>
  <circle cx="102" cy="166" r="7" fill="#1f2937"/>
  <text x="58" y="159" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">lambda</text>
  <text x="48" y="177" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">mot exemple</text>
  <text x="58" y="136" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe 1</text>
  <text x="314" y="360" font-family="Arial, sans-serif" font-size="14" fill="#ef8354">Classe 2</text>
  <text x="42" y="410" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">On lit chaque classe comme un vecteur partant du centre AFC.</text>
  <text x="42" y="438" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Puis on compare l'angle entre les deux directions.</text>
  <text x="42" y="478" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">Directions opposees = A_theta plus eleve</text>
  <text x="42" y="502" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">Directions proches = A_theta plus faible</text>
</svg>
