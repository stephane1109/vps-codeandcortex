<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">A_theta - opposition angulaire des classes</title>
  <desc id="desc">Deux vecteurs de classes partent du centre AFC dans des directions opposees. Le mot-exemple lambda suit la classe 1.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#41b3a3"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef8354"/>
    </marker>
  </defs>
  <rect width="720" height="400" rx="20" fill="#fbfaf7"/>
  <rect x="22" y="22" width="676" height="356" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_theta</text>
  <text x="42" y="80" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Opposition angulaire des classes sur le plan AFC</text>
  <line x1="205" y1="315" x2="205" y2="102" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="110" y1="215" x2="640" y2="215" stroke="#d8d2c8" stroke-width="2"/>
  <circle cx="205" cy="215" r="7" fill="#2f2a27"/>
  <text x="220" y="233" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">centre</text>
  <line x1="205" y1="215" x2="110" y2="115" stroke="#41b3a3" stroke-width="6" marker-end="url(#arrow-teal)"/>
  <line x1="205" y1="215" x2="595" y2="315" stroke="#ef8354" stroke-width="6" marker-end="url(#arrow-coral)"/>
  <path d="M138 147 A88 88 0 0 1 288 302" fill="none" stroke="#7f756b" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">angle fort</text>
  <circle cx="128" cy="133" r="7" fill="#1f2937"/>
  <text x="88" y="126" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">lambda</text>
  <text x="75" y="143" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">mot exemple</text>
  <text x="76" y="103" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe 1</text>
  <text x="596" y="335" font-family="Arial, sans-serif" font-size="14" fill="#ef8354">Classe 2</text>
  <text x="372" y="122" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Quand les directions de deux classes s'opposent,</text>
  <text x="372" y="144" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">A_theta monte.</text>
</svg>
