<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">A_dist - distance entre classes</title>
  <desc id="desc">Deux classes eloignees sur le plan AFC. La distance euclidienne se calcule avec d(i, j) = √((x_j - x_i)² + (y_j - y_i)²). Le mot-exemple lambda se place pres de la classe i.</desc>
  <rect width="600" height="600" rx="20" fill="#fbfaf7"/>
  <rect x="20" y="20" width="560" height="560" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_dist</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Distance spatiale minimale entre classes</text>
  <line x1="90" y1="330" x2="500" y2="330" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="130" y1="370" x2="130" y2="120" stroke="#d8d2c8" stroke-width="2"/>
  <circle cx="170" cy="170" r="16" fill="#41b3a3"/>
  <circle cx="430" cy="290" r="16" fill="#5979c9"/>
  <line x1="170" y1="170" x2="430" y2="170" stroke="#c7c1b6" stroke-width="3" stroke-dasharray="8 7"/>
  <line x1="430" y1="170" x2="430" y2="290" stroke="#c7c1b6" stroke-width="3" stroke-dasharray="8 7"/>
  <line x1="170" y1="170" x2="430" y2="290" stroke="#7f756b" stroke-width="4"/>
  <path d="M414 170 L414 186 L430 186" fill="none" stroke="#7f756b" stroke-width="2.5"/>
  <text x="270" y="160" font-family="Arial, sans-serif" font-size="14" fill="#8a8178">dx = x_j - x_i</text>
  <text x="442" y="236" font-family="Arial, sans-serif" font-size="14" fill="#8a8178">dy = y_j - y_i</text>
  <circle cx="205" cy="145" r="6" fill="#1f2937"/>
  <text x="217" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">lambda</text>
  <text x="217" y="168" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">mot exemple</text>
  <text x="138" y="145" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe i</text>
  <text x="383" y="320" font-family="Arial, sans-serif" font-size="14" fill="#5979c9">Classe j</text>
  <text x="42" y="406" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">On mesure ici la separation spatiale entre deux classes.</text>
  <text x="42" y="434" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">On utilise les ecarts en x et en y pour calculer cette distance.</text>
  <text x="42" y="476" font-family="Arial, sans-serif" font-size="15" fill="#7f756b">d(i, j) = √((x_j - x_i)² + (y_j - y_i)²)</text>
  <text x="42" y="500" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">Plus cette distance est grande, plus A_dist monte.</text>
</svg>
