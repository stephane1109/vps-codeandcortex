<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">A_dist - distance entre classes</title>
  <desc id="desc">Deux classes eloignees sur le plan AFC. La distance euclidienne d(i,j) est calculee avec d(i,j) = sqrt((x_j - x_i)² + (y_j - y_i)²). Le mot-exemple lambda se place pres de la classe i.</desc>
  <rect width="720" height="400" rx="20" fill="#fbfaf7"/>
  <rect x="22" y="22" width="676" height="356" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_dist</text>
  <text x="42" y="80" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Distance spatiale minimale entre classes</text>
  <line x1="110" y1="300" x2="640" y2="300" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="170" y1="338" x2="170" y2="84" stroke="#d8d2c8" stroke-width="2"/>
  <circle cx="220" cy="145" r="16" fill="#41b3a3"/>
  <circle cx="565" cy="255" r="16" fill="#5979c9"/>
  <line x1="220" y1="145" x2="565" y2="145" stroke="#c7c1b6" stroke-width="3" stroke-dasharray="8 7"/>
  <line x1="565" y1="145" x2="565" y2="255" stroke="#c7c1b6" stroke-width="3" stroke-dasharray="8 7"/>
  <line x1="220" y1="145" x2="565" y2="255" stroke="#7f756b" stroke-width="4"/>
  <path d="M549 145 L549 161 L565 161" fill="none" stroke="#7f756b" stroke-width="2.5"/>
  <text x="374" y="138" font-family="Arial, sans-serif" font-size="14" fill="#8a8178">dx = x_j - x_i</text>
  <text x="576" y="206" font-family="Arial, sans-serif" font-size="14" fill="#8a8178">dy = y_j - y_i</text>
  <text x="272" y="328" font-family="Arial, sans-serif" font-size="15" fill="#7f756b">d(i, j) = sqrt((x_j - x_i)² + (y_j - y_i)²)</text>
  <text x="332" y="350" font-family="Arial, sans-serif" font-size="13" fill="#7f756b">distance euclidienne</text>
  <circle cx="260" cy="122" r="6" fill="#1f2937"/>
  <text x="272" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">lambda</text>
  <text x="272" y="144" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">mot exemple</text>
  <text x="188" y="122" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">Classe i</text>
  <text x="518" y="286" font-family="Arial, sans-serif" font-size="14" fill="#5979c9">Classe j</text>
</svg>
