<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">A_poles - opposition des poles lexicaux</title>
  <desc id="desc">Pour chaque classe, on prend tous les mots significatifs projetes sur l'AFC, puis on calcule le point moyen de leurs coordonnees x et y. Ce point moyen est le pole lexical.</desc>
  <rect width="600" height="600" rx="20" fill="#fbfaf7"/>
  <rect x="20" y="20" width="560" height="560" rx="18" fill="#ffffff" stroke="#e2ddd4"/>
  <text x="42" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f2a27">A_poles</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="14" fill="#6d655d">Chaque pole lexical est le centre moyen des mots significatifs d'une classe</text>
  <line x1="80" y1="340" x2="360" y2="340" stroke="#d8d2c8" stroke-width="2"/>
  <line x1="135" y1="372" x2="135" y2="118" stroke="#d8d2c8" stroke-width="2"/>
  <text x="368" y="345" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">axe x</text>
  <text x="143" y="130" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">axe y</text>
  <circle cx="135" cy="340" r="7" fill="#2f2a27"/>
  <text x="148" y="358" font-family="Arial, sans-serif" font-size="13" fill="#6d655d">origine</text>
  <circle cx="198" cy="208" r="6" fill="#1f2937"/>
  <text x="210" y="203" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">lambda</text>
  <text x="210" y="220" font-family="Arial, sans-serif" font-size="12" fill="#6d655d">(x_lambda, y_lambda)</text>
  <circle cx="178" cy="238" r="5" fill="#41b3a3" opacity="0.75"/>
  <text x="186" y="244" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">mot_2</text>
  <circle cx="232" cy="228" r="5" fill="#41b3a3" opacity="0.75"/>
  <text x="240" y="234" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">mot_3</text>
  <circle cx="208" cy="268" r="5" fill="#41b3a3" opacity="0.75"/>
  <text x="216" y="274" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">mot_4</text>
  <circle cx="206" cy="236" r="13" fill="#41b3a3"/>
  <text x="224" y="240" font-family="Arial, sans-serif" font-size="14" fill="#41b3a3">pole_i</text>
  <text x="224" y="257" font-family="Arial, sans-serif" font-size="12" fill="#41b3a3">(moyenne des x, moyenne des y)</text>
  <line x1="198" y1="208" x2="206" y2="236" stroke="#7f756b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="178" y1="238" x2="206" y2="236" stroke="#7f756b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="232" y1="228" x2="206" y2="236" stroke="#7f756b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="208" y1="268" x2="206" y2="236" stroke="#7f756b" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="434" cy="182" r="5" fill="#5979c9" opacity="0.75"/>
  <circle cx="468" cy="226" r="5" fill="#5979c9" opacity="0.75"/>
  <circle cx="496" cy="194" r="5" fill="#5979c9" opacity="0.75"/>
  <circle cx="467" cy="200" r="13" fill="#5979c9"/>
  <text x="485" y="204" font-family="Arial, sans-serif" font-size="14" fill="#5979c9">pole_j</text>
  <text x="485" y="221" font-family="Arial, sans-serif" font-size="12" fill="#5979c9">(autre classe)</text>
  <line x1="219" y1="235" x2="454" y2="202" stroke="#7f756b" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="296" y="208" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">distance entre les deux poles</text>
  <text x="42" y="410" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Pour chaque classe, on prend tous les mots significatifs sur l'AFC.</text>
  <text x="42" y="438" font-family="Arial, sans-serif" font-size="15" fill="#2f2a27">Puis on calcule leur point moyen en x et en y.</text>
  <text x="42" y="478" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">x_pole_i = moyenne(x_lambda, x_2, x_3, x_4)</text>
  <text x="42" y="502" font-family="Arial, sans-serif" font-size="14" fill="#7f756b">y_pole_i = moyenne(y_lambda, y_2, y_3, y_4)</text>
</svg>
