<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Du nuage de mots significatifs au centre lexical d'une classe</title>
  <desc id="desc">Un plan AFC montre trois classes de mots significatifs et le centre moyen de leurs coordonnées x et y.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f6f1e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#25333b" flood-opacity=".10"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="#dce4e5" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#344b58"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="url(#paper)"/>
  <rect x="42" y="38" width="1356" height="824" rx="30" fill="#ffffff" stroke="#e3ddd2" stroke-width="2" filter="url(#shadow)"/>

  <text x="96" y="112" fill="#1d3541" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="33" font-weight="700">1. Des mots significatifs au centre lexical</text>
  <text x="96" y="151" fill="#62727a" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20">Chaque mot caractéristique possède des coordonnées x, y sur le plan AFC.</text>

  <rect x="88" y="194" width="892" height="602" rx="22" fill="url(#grid)" stroke="#d5e0e1" stroke-width="2"/>
  <line x1="152" y1="698" x2="931" y2="698" stroke="#475c65" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="152" y1="698" x2="152" y2="248" stroke="#475c65" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="894" y="733" fill="#344b58" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600">Axe 1 (x)</text>
  <text x="82" y="267" fill="#344b58" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" transform="rotate(-90 82 267)">Axe 2 (y)</text>
  <text x="164" y="723" fill="#7a898e" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="16">origine</text>

  <ellipse cx="351" cy="365" rx="154" ry="111" fill="#38a995" fill-opacity=".11" stroke="#2f9d89" stroke-width="2.5" stroke-dasharray="9 9"/>
  <circle cx="277" cy="321" r="10" fill="#2f9d89"/>
  <circle cx="329" cy="283" r="9" fill="#2f9d89"/>
  <circle cx="386" cy="335" r="11" fill="#2f9d89"/>
  <circle cx="422" cy="403" r="9" fill="#2f9d89"/>
  <circle cx="335" cy="445" r="10" fill="#2f9d89"/>
  <circle cx="244" cy="400" r="8" fill="#2f9d89"/>
  <text x="221" y="300" fill="#277969" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">soin</text>
  <text x="340" y="264" fill="#277969" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">lambda</text>
  <text x="399" y="319" fill="#277969" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">santé</text>
  <text x="433" y="438" fill="#277969" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">clinique</text>
  <circle cx="333" cy="363" r="14" fill="#173b43" stroke="#ffffff" stroke-width="5"/>
  <text x="353" y="370" fill="#173b43" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">C₁</text>

  <ellipse cx="670" cy="527" rx="164" ry="118" fill="#f08b5d" fill-opacity=".12" stroke="#e67a4b" stroke-width="2.5" stroke-dasharray="9 9"/>
  <circle cx="562" cy="502" r="9" fill="#e67a4b"/>
  <circle cx="618" cy="444" r="10" fill="#e67a4b"/>
  <circle cx="696" cy="468" r="8" fill="#e67a4b"/>
  <circle cx="767" cy="530" r="11" fill="#e67a4b"/>
  <circle cx="700" cy="604" r="9" fill="#e67a4b"/>
  <circle cx="609" cy="599" r="10" fill="#e67a4b"/>
  <text x="527" y="489" fill="#b55531" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">loi</text>
  <text x="624" y="425" fill="#b55531" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">État</text>
  <text x="704" y="451" fill="#b55531" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">débat</text>
  <text x="775" y="564" fill="#b55531" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">vote</text>
  <circle cx="659" cy="528" r="14" fill="#173b43" stroke="#ffffff" stroke-width="5"/>
  <text x="679" y="535" fill="#173b43" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">C₂</text>

  <ellipse cx="780" cy="330" rx="142" ry="99" fill="#4d89c9" fill-opacity=".12" stroke="#3e7fbe" stroke-width="2.5" stroke-dasharray="9 9"/>
  <circle cx="688" cy="298" r="9" fill="#3e7fbe"/>
  <circle cx="744" cy="260" r="10" fill="#3e7fbe"/>
  <circle cx="811" cy="286" r="8" fill="#3e7fbe"/>
  <circle cx="861" cy="350" r="10" fill="#3e7fbe"/>
  <circle cx="785" cy="394" r="9" fill="#3e7fbe"/>
  <circle cx="705" cy="366" r="8" fill="#3e7fbe"/>
  <text x="650" y="282" fill="#326ba8" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">emploi</text>
  <text x="755" y="242" fill="#326ba8" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">budget</text>
  <text x="824" y="270" fill="#326ba8" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">travail</text>
  <text x="870" y="385" fill="#326ba8" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">revenu</text>
  <circle cx="774" cy="326" r="14" fill="#173b43" stroke="#ffffff" stroke-width="5"/>
  <text x="794" y="333" fill="#173b43" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">C₃</text>

  <rect x="1022" y="194" width="324" height="602" rx="22" fill="#f5f8f7" stroke="#d7e2df" stroke-width="2"/>
  <text x="1064" y="258" fill="#173b43" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700">Centre d'une classe</text>
  <line x1="1064" y1="282" x2="1298" y2="282" stroke="#d4dfdc" stroke-width="2"/>
  <text x="1064" y="332" fill="#53676d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20">Pour la classe i :</text>
  <rect x="1064" y="360" width="240" height="78" rx="15" fill="#e5f4ef"/>
  <text x="1088" y="408" fill="#176553" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700">Cᵢ = (x̄ᵢ, ȳᵢ)</text>
  <text x="1064" y="488" fill="#53676d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19">x̄ᵢ = moyenne des x</text>
  <text x="1064" y="522" fill="#53676d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19">ȳᵢ = moyenne des y</text>
  <text x="1064" y="580" fill="#53676d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">Le point noir est le</text>
  <text x="1064" y="610" fill="#53676d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">centre lexical moyen</text>
  <text x="1064" y="640" fill="#53676d" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">des mots significatifs.</text>
</svg>
