<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Du voisin lexical le plus proche au score robuste S</title>
  <desc id="desc">Cinq classes sont comparées à leur voisin le plus proche, puis la valeur centrale de ces scores produit S robuste.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f4f1f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#25333b" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334d59"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="url(#paper)"/>
  <rect x="42" y="38" width="1356" height="824" rx="30" fill="#ffffff" stroke="#e3ddd2" stroke-width="2" filter="url(#shadow)"/>
  <text x="96" y="112" fill="#1d3541" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="33" font-weight="700">3. Du voisin le plus proche au score robuste S</text>
  <text x="96" y="151" fill="#62727a" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20">Chaque classe regarde d'abord la classe dont elle est lexicalement la plus proche.</text>

  <rect x="88" y="194" width="732" height="532" rx="22" fill="#f9fbfb" stroke="#d8e4e5" stroke-width="2"/>
  <text x="125" y="247" fill="#3a5661" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700">A. Pour chaque classe : conserver le voisin le plus proche</text>

  <line x1="290" y1="377" x2="528" y2="444" stroke="#2f9d89" stroke-width="6" stroke-linecap="round"/>
  <line x1="290" y1="377" x2="381" y2="600" stroke="#e67a4b" stroke-width="6" stroke-linecap="round"/>
  <line x1="528" y1="444" x2="640" y2="570" stroke="#c59009" stroke-width="6" stroke-linecap="round"/>
  <line x1="290" y1="377" x2="690" y2="345" stroke="#8755a7" stroke-width="6" stroke-linecap="round"/>
  <line x1="290" y1="377" x2="640" y2="570" stroke="#cfdade" stroke-width="2" stroke-dasharray="7 8"/>
  <line x1="528" y1="444" x2="381" y2="600" stroke="#cfdade" stroke-width="2" stroke-dasharray="7 8"/>
  <line x1="528" y1="444" x2="690" y2="345" stroke="#cfdade" stroke-width="2" stroke-dasharray="7 8"/>
  <line x1="381" y1="600" x2="690" y2="345" stroke="#cfdade" stroke-width="2" stroke-dasharray="7 8"/>
  <line x1="381" y1="600" x2="640" y2="570" stroke="#cfdade" stroke-width="2" stroke-dasharray="7 8"/>
  <line x1="640" y1="570" x2="690" y2="345" stroke="#cfdade" stroke-width="2" stroke-dasharray="7 8"/>

  <circle cx="290" cy="377" r="64" fill="#2f9d89" fill-opacity=".16" stroke="#2f9d89" stroke-width="3"/>
  <circle cx="290" cy="377" r="17" fill="#173b43" stroke="#ffffff" stroke-width="5"/>
  <text x="258" y="475" fill="#277969" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700">Classe 1</text>
  <circle cx="528" cy="444" r="60" fill="#4d89c9" fill-opacity=".16" stroke="#3e7fbe" stroke-width="3"/>
  <circle cx="528" cy="444" r="17" fill="#173b43" stroke="#ffffff" stroke-width="5"/>
  <text x="494" y="538" fill="#326ba8" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700">Classe 2</text>
  <circle cx="381" cy="600" r="62" fill="#f08b5d" fill-opacity=".16" stroke="#e67a4b" stroke-width="3"/>
  <circle cx="381" cy="600" r="17" fill="#173b43" stroke="#ffffff" stroke-width="5"/>
  <text x="346" y="692" fill="#b55531" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700">Classe 3</text>
  <circle cx="640" cy="570" r="57" fill="#d6a726" fill-opacity=".16" stroke="#c59009" stroke-width="3"/>
  <circle cx="640" cy="570" r="17" fill="#173b43" stroke="#ffffff" stroke-width="5"/>
  <text x="604" y="660" fill="#957108" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700">Classe 4</text>
  <circle cx="690" cy="345" r="55" fill="#9567b7" fill-opacity=".15" stroke="#8755a7" stroke-width="3"/>
  <circle cx="690" cy="345" r="17" fill="#173b43" stroke="#ffffff" stroke-width="5"/>
  <text x="645" y="282" fill="#71408e" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700">Classe 5</text>

  <rect x="347" y="369" width="112" height="44" rx="11" fill="#e6f3ed"/>
  <text x="366" y="398" fill="#176553" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">2,13</text>
  <rect x="256" y="485" width="98" height="42" rx="11" fill="#f9eadf"/>
  <text x="274" y="513" fill="#a94f2e" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">3,72</text>
  <rect x="592" y="470" width="94" height="42" rx="11" fill="#f6efcf"/>
  <text x="608" y="498" fill="#957108" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">4,86</text>
  <rect x="450" y="320" width="98" height="42" rx="11" fill="#eee4f5"/>
  <text x="468" y="348" fill="#71408e" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">7,27</text>
  <text x="126" y="702" fill="#71858b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="16">Traits pleins : voisin le plus proche d'au moins une classe. Traits pointillés : autres paires.</text>

  <rect x="862" y="194" width="484" height="532" rx="22" fill="#f8f4ed" stroke="#eadcc7" stroke-width="2"/>
  <text x="905" y="247" fill="#3a4d54" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700">B. Former le score robuste</text>
  <text x="905" y="296" fill="#62727a" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">Valeurs classées dans cet exemple :</text>

  <rect x="905" y="316" width="398" height="40" rx="12" fill="#eef4f3"/>
  <text x="929" y="343" fill="#38555e" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">s_proche(Classe 1) = 2,13</text>
  <rect x="905" y="363" width="398" height="40" rx="12" fill="#eef4f3"/>
  <text x="929" y="390" fill="#38555e" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">s_proche(Classe 2) = 2,13</text>
  <rect x="905" y="410" width="398" height="40" rx="12" fill="#dceee6" stroke="#2f9d89" stroke-width="2"/>
  <text x="929" y="437" fill="#176553" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">s_proche(Classe 3) = 3,72</text>
  <rect x="905" y="457" width="398" height="40" rx="12" fill="#eef4f3"/>
  <text x="929" y="484" fill="#38555e" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">s_proche(Classe 4) = 4,86</text>
  <rect x="905" y="504" width="398" height="40" rx="12" fill="#eef4f3"/>
  <text x="929" y="531" fill="#38555e" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">s_proche(Classe 5) = 7,27</text>
  <path d="M1104 556 L1104 585" stroke="#6d7f85" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="905" y="600" width="398" height="94" rx="16" fill="#e5f4ef"/>
  <text x="932" y="632" fill="#176553" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18">Cinq valeurs : la médiane est celle du milieu.</text>
  <text x="932" y="663" fill="#176553" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700">S_robuste = 3,72</text>
  <text x="932" y="686" fill="#176553" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15">3e valeur de [2,13 ; 2,13 ; 3,72 ; 4,86 ; 7,27]</text>

  <rect x="88" y="744" width="1258" height="78" rx="17" fill="#edf4f4"/>
  <text x="121" y="777" fill="#34525b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19">La CHD retenue est celle dont S_robuste est le plus élevé. La pire paire est le minimum de toutes les paires :</text>
  <text x="121" y="806" fill="#34525b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19">elle sert seulement de garde-fou et de départage en cas d'égalité.</text>
</svg>
