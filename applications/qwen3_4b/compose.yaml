services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Renseigner APP_PASSWORD dans Coolify}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b-q4_K_M
    depends_on:
      - ollama
    expose:
      - "8501"
    restart: unless-stopped
    mem_limit: 768m
  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama_modeles:/root/.ollama
    restart: unless-stopped
    mem_limit: 7g
  charger_modele:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 3; done; ollama pull qwen3:4b-q4_K_M"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    restart: "no"
volumes:
  ollama_modeles:
