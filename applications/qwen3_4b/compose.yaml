services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Renseigner APP_PASSWORD dans Coolify}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-q4_K_M}
      QWEN_NUM_CTX: ${QWEN_NUM_CTX:-2048}
    depends_on:
      - ollama
    expose:
      - "8501"
    restart: unless-stopped
    mem_limit: 768m
  ollama:
    image: ${OLLAMA_CPU_IMAGE:-alpine/ollama:latest}
    expose:
      - "11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: ${QWEN_NUM_CTX:-2048}
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama_modeles:/root/.ollama
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-7g}
  charger_modele:
    image: ${OLLAMA_CPU_IMAGE:-alpine/ollama:latest}
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 3; done; ollama pull $$OLLAMA_MODEL"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-q4_K_M}
    depends_on:
      - ollama
    restart: "no"
volumes:
  ollama_modeles:
